name: Build et tests CMake

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du dépôt
        uses: actions/checkout@v4

      - name: Installer les outils de compilation
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake ninja-build gcc

      - name: Configurer CMake
        run: cmake -S implement-workflows -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Compiler le projet
        run: cmake --build build --parallel

      - name: Exécuter les tests
        run: ctest --test-dir build --output-on-failure